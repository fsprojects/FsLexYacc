version: 2
updates:
  # Reaches .config/dotnet-tools.json and global.json only. The packages in paket.dependencies
  # are not covered: Dependabot has no Paket support, so those are still bumped by hand.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dotnet:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
