version: 2
updates:
  # Reaches Directory.Packages.props, .config/dotnet-tools.json and global.json.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # The floor our packages ask for, pinned on purpose in Directory.Packages.props.
      - dependency-name: "FSharp.Core"
    groups:
      dotnet:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
