name: Build and Test and Publish (master)

on:
  push:
    branches:
    - master

# contents: write, so the build can create the GitHub release.
permissions:
  contents: write
  pages: write
  id-token: write
  security-events: write

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET for main project build
      uses: actions/setup-dotnet@v6
    - name: Install local tools
      run: dotnet tool restore
    - name: Paket restore
      run: dotnet paket restore
    # Builds, tests, packs, and then publishes: the packages go to NuGet and a GitHub release is
    # created for the version at the top of CHANGELOG.md, unless that release already exists.
    - name: Build and release
      run: dotnet fsi build.fsx -p Release
      env:
        NUGET_KEY: ${{ secrets.NUGET_KEY }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # A baseline on the default branch, so code scanning can tell a pull request's new findings
    # from the ones it inherited.
    - name: Analyze
      run: dotnet fsi build.fsx -p Analyze
      continue-on-error: true
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ./analysis.sarif
    - name: Build documentation
      run: dotnet fsi build.fsx -p Docs
    - name: Upload documentation
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./output

  docs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
