name: Build and Test and Publish (master)

on:
  push:
    branches:
    - master

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET for main project build
      uses: actions/setup-dotnet@v6
    - name: Install local tools
      run: dotnet tool restore
    - name: Paket restore
      run: dotnet paket restore
    - name: Build
      run: dotnet fsi build.fsx -p Release
    - name: Publish NuGets (if main version changed)
      run: dotnet nuget push "bin/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_KEY }} --skip-duplicate
    # A baseline on the default branch, so code scanning can tell a pull request's new findings
    # from the ones it inherited.
    - name: Analyze
      run: dotnet fsi build.fsx -p Analyze
      continue-on-error: true
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ./analysis.sarif
    - name: Build documentation
      run: dotnet fsi build.fsx -p Docs
    - name: Upload documentation
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./output

  docs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
